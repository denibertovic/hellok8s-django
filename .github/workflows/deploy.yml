name: k8s
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      namespace:
        required: true
        type: string
      url:
        required: true
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    name: helm
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4.0.0
      - name: Setup Helm
        uses: azure/setup-helm@v4.0.0
      - name: Install sops
        uses: mdgreenwald/mozilla-sops-action@v1.6.0
        with:
          version: "3.8.1" # default is latest stable
      - name: Install make
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends make
      - name: Setup Kubeconfig
        # No stored credential: kubectl and helm call gh-oidc-cred.sh, which
        # requests a 5 minute GitHub OIDC token for this job and refreshes it
        # when it expires. The apiserver on daenerys trusts GitHub as a JWT
        # issuer and maps the token to the user gh:<owner>/<repo>.
        run: |
          mkdir -p ~/.kube
          cat <<'EOF' > ~/.kube/gh-oidc-cred.sh
          #!/usr/bin/env bash
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=daenerys-prod-k8s" | jq -r .value)
          # tokens live 5 minutes; report 4 so a refresh happens before expiry
          expires=$(date -u -d "+4 minutes" +%Y-%m-%dT%H:%M:%SZ)
          jq -n --arg t "$token" --arg e "$expires" \
            '{apiVersion: "client.authentication.k8s.io/v1", kind: "ExecCredential", status: {token: $t, expirationTimestamp: $e}}'
          EOF
          chmod 700 ~/.kube/gh-oidc-cred.sh
          cat <<EOF > ~/.kube/k8s.yaml
          apiVersion: v1
          kind: Config
          clusters:
          - name: daenerys-prod
            cluster:
              server: https://daenerys.initeq.net:6443
              certificate-authority-data: 
          contexts:
          - name: ${{ inputs.namespace }}
            context:
              cluster: daenerys-prod
              user: github-oidc
              namespace: ${{ inputs.namespace }}
          current-context: ${{ inputs.namespace }}
          users:
          - name: github-oidc
            user:
              exec:
                apiVersion: client.authentication.k8s.io/v1
                command: $HOME/.kube/gh-oidc-cred.sh
                interactiveMode: Never
          EOF
          chmod 600 ~/.kube/k8s.yaml
        shell: bash
      - name: Setup age keys
        run: |
          mkdir -p ~/.age
          cat <<EOF > ~/.age/keys.txt
          ${{ secrets.AGE_KEY_FILE }}
          EOF
          chmod 700 ~/.age/keys.txt
        shell: bash
      - name: Verify cluster identity
        run: kubectl auth whoami --kubeconfig ~/.kube/k8s.yaml
      - name: set SHORT_SHA
        run: echo "SHORT_SHA=$(git rev-parse --short=8 HEAD)" >> $GITHUB_ENV
      - name: Helm deploy
        shell: bash
        env:
          IMAGE_TAG: "sha-${{ env.SHORT_SHA }}"
          NAMESPACE: "${{ inputs.namespace }}"
          ENVIRONMENT: "${{ inputs.environment }}"
        run: make SOPS_AGE_KEY_FILE=$HOME/.age/keys.txt KUBECONFIG=$HOME/.kube/k8s.yaml deploy
